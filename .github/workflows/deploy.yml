name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Secrets
        run: |
          if [ -z "${{ secrets.DEEPSEEK_API_KEY }}" ]; then
            echo "::warning::DEEPSEEK_API_KEY secret is not set. Using placeholder."
          else
            sed -i "s/__DEEPSEEK_API_KEY__/${{ secrets.DEEPSEEK_API_KEY }}/g" ai-service.js
            echo "API key injected successfully."
          fi
          if [ -z "${{ secrets.CLARITY_PROJECT_ID }}" ]; then
            echo "::warning::CLARITY_PROJECT_ID secret is not set. Clarity analytics disabled."
          else
            sed -i "s/__CLARITY_PROJECT_ID__/${{ secrets.CLARITY_PROJECT_ID }}/g" index.html
            echo "Clarity project ID injected successfully."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
